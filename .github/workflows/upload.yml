name: Captain Upload API

on:
  workflow_dispatch:
    inputs:
      filename:
        required: true
        type: string
      content:
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Upload file
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CAPTAIN_TOKEN }}
          script: |
            const filename = "${{ inputs.filename }}";
            const content = "${{ inputs.content }}";

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filename,
              message: "Captain upload",
              content: content
            });

            console.log("Uploaded:", filename);
