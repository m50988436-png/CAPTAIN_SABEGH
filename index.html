<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>𝐂𝐀𝐏𝐓𝐀𝐈𝐍</title>

<style>

#overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
backdrop-filter:blur(8px);
opacity:0;
visibility:hidden;
transition:.4s;
z-index:99;
}

#overlay.show{
opacity:1;
visibility:visible;
}

#box{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(.8);
width:90%;
max-width:500px;
max-height:80vh;
padding:25px;
background:#111;
border:1px solid #ffffff30;
border-radius:25px;
text-align:center;
opacity:0;
visibility:hidden;
transition:.4s;
z-index:100;
overflow-y:auto;
}

#closeBtn{
position:fixed;
right:20px;
top:50%;
transform:translateY(-50%);
padding:12px 20px;
border-radius:15px;
background:#111;
color:white;
border:1px solid #fff;
cursor:pointer;
z-index:10000;
display:none;
}

#box.show{
opacity:1;
visibility:visible;
transform:translate(-50%,-50%) scale(1);
}

.photo{
width:100%;
margin-top:20px;
border-radius:20px;
}

audio{
width:100%;
margin-top:20px;
}

button{
margin-top:20px;
padding:10px 20px;
border:none;
border-radius:15px;
cursor:pointer;
}


*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
background:
radial-gradient(circle,#333,transparent 30%),
linear-gradient(135deg,#000,#111);
color:white;
font-family:tahoma;
overflow-y:auto;
}

body:before{
content:"";
position:fixed;
inset:0;
background-image:radial-gradient(#fff 1px,transparent 1px);
background-size:40px 40px;
opacity:.2;
animation:bg 20s linear infinite;
pointer-events:none;
}

@keyframes bg{
to{background-position:0 500px}
}


.hero{
height:300px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}


.logo{
font-size:55px;
letter-spacing:10px;
font-weight:900;
background:linear-gradient(90deg,#fff,#777,#fff);
-webkit-background-clip:text;
color:transparent;
animation:up 3s infinite;
}


@keyframes up{
50%{transform:translateY(-15px)}
}


.sub{
color:#aaa;
margin-top:20px;
letter-spacing:5px;
}


.cards{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}


.card{
width:220px;
height:280px;
border-radius:30px;
background:#ffffff15;
border:1px solid #ffffff40;
backdrop-filter:blur(15px);
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
transition:.5s;
animation:show 1s;
}


.card:hover{
transform:
rotateY(20deg)
translateY(-20px)
scale(1.05);
box-shadow:0 0 40px #fff5;
}


@keyframes show{
from{
opacity:0;
transform:translateY(100px);
}
}

#login{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
backdrop-filter:blur(10px);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
}

#player{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:90%;
max-width:500px;
background:transparent;
padding:0;
display:none;
z-index:9999;
}


#login h1{
margin-bottom:25px;
font-size:35px;
}

#login button{
width:220px;
padding:15px;
margin:10px;
font-size:20px;
border:none;
border-radius:15px;
cursor:pointer;
}

#login{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
backdrop-filter:blur(10px);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.musicCard{
margin-bottom:50px;
}

#content h3{
    margin-top:15px;
    font-size:22px;
    white-space:normal;
    word-break:break-word;
    overflow-wrap:break-word;
    text-align:center;
}

.downloadBtn{
    width:220px;
    height:55px;
    margin-top:20px;
    border-radius:15px;
    background:white;
    color:black;
    font-size:20px;
    font-weight:bold;
    transition:.3s;
}

.downloadBtn.active{
    background:#00ff55;
    color:white;
}

.aboutCard{
width:320px;
height:100px;
margin:35px auto 30px;
border-radius:20px;
background:#ffffff15;
border:1px solid #00ffff;
backdrop-filter:blur(15px);
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
font-weight:bold;
transition:.5s;
cursor:pointer;
box-shadow:
0 0 10px #00ffff,
0 0 25px #00ffff;
}

.aboutCard:hover{
transform:translateY(-8px) scale(1.05);
box-shadow:
0 0 20px #00ffff,
0 0 40px #00ffff;
}


.socialBtn{
width:200px;
height:55px;
margin:15px;
border-radius:15px;
font-size:20px;
font-weight:bold;
cursor:pointer;
color:white;
transition:.3s;
}

.telegramBtn{
background:#0088ff;
box-shadow:
0 0 10px #0088ff,
0 0 25px #0088ff;
}

.rubikaBtn{
background:#00c853;
box-shadow:
0 0 10px #00c853,
0 0 25px #00c853;
}

.socialBtn:hover{
transform:scale(1.08);
}

</style>


</head>

<script>

let photos = [];
let musics = [];

const githubUser = "m50988436-png";
const githubRepo = "CAPTAIN_SABEGH";


async function loadFiles(){

let photoRes = await fetch(
`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/photos`
);

let photoFiles = await photoRes.json();

photos = photoFiles
.filter(file =>
file.name.endsWith(".jpg") ||
file.name.endsWith(".png") ||
file.name.endsWith(".jpeg")
)
.map(file => file.download_url);



let musicRes = await fetch(
`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/music`
);

let musicFiles = await musicRes.json();

musics = musicFiles
.filter(file =>
file.name.endsWith(".mp3")
)
.map(file => file.download_url);

}

async function downloadImage(url,btn){

btn.classList.add("active");

setTimeout(()=>{
    btn.classList.remove("active");
},2000);


let response = await fetch(url);

let blob = await response.blob();

let randomNumber = Math.floor(10000 + Math.random() * 90000);

let link = document.createElement("a");

link.href = URL.createObjectURL(blob);

link.download = "CAPTAIN-photo-" + randomNumber + ".jpg";

link.click();

URL.revokeObjectURL(link.href);

}

function playMusic(url){

let audio=document.getElementById("mainAudio");

audio.src=url;

audio.play();

document.getElementById("player").style.display="block";


}

function stopMusic(){

let audio=document.getElementById("mainAudio");

audio.pause();
audio.currentTime=0;

document.getElementById("player").style.display="none";

}



</script>


<button id="closeBtn" onclick="closeBox()">✕ بستن</button>

<body>

<div id="overlay" onclick="closeBox()"></div>

<div id="box">

<h2 id="title"></h2>

<div id="content"></div>

</div>

<div id="player">

<audio id="mainAudio" controls></audio>

<button onclick="stopMusic()">✕</button>

</div>

<script>

async function openBox(type){

document.getElementById("closeBtn").style.display="block";

document.getElementById("overlay").classList.add("show");
document.getElementById("box").classList.add("show");

if(type=="photo"){

document.getElementById("title").innerHTML="PHOTO";

let html = "";

photos.forEach(function(photo){

html += `
<div style="text-align:center;">

<img src="${photo}" class="photo">

<br>

<button class="downloadBtn" onclick="downloadImage('${photo}',this)">
↑ DOWNLOAD ↑
</button>

</div>
`;

});

document.getElementById("content").innerHTML = html;

}

if(type=="music"){

document.getElementById("title").innerHTML="MUSIC";

let html="";

for(const music of musics){

let fileName = decodeURIComponent(
music.split("/").pop()
);

let musicName = fileName.replace(".mp3","");

let cover = "photos/captain.jpg";

html += `
<div style="
margin:20px;
padding:20px;
border-radius:20px;
background:#ffffff10;
">

<img src="${cover}"
style="
width:220px;
height:220px;
object-fit:cover;
border-radius:20px;
">

<h3>${musicName}</h3>

<button onclick="playMusic('${music}')">
▶ PLAY
</button>

</div>
`;

}

document.getElementById("content").innerHTML=html;

}

if(type=="about"){

document.getElementById("title").innerHTML="ABOUT US";

let html=`

<h2 style="margin:30px">
OUR INFORMATION
</h2>

<a href="https://t.me/CAPTAIN_SABEGH" target="_blank">
<button class="socialBtn telegramBtn">
TELEGRAM
</button>
</a>

<a href="https://rubika.ir/LINK_CAPTAIN" target="_blank">
<button class="socialBtn rubikaBtn">
RUBIKA
</button>
</a>

`;

document.getElementById("content").innerHTML=html;

}

}

function closeBox(){

document.getElementById("closeBtn").style.display="none";

document.getElementById("overlay").classList.remove("show");
document.getElementById("box").classList.remove("show");

}

</script>


<script>
loadFiles();
</script>

<div class="hero" id="hero">

<div class="logo">
𝐂𝐀𝐏𝐓𝐀𝐈𝐍
</div>

<div class="sub">
LUXURY DIGITAL GALLERY
</div>

</div>


<div class="cards" id="cards">

<div class="card" onclick="openBox('photo')">
PHOTO
</div>

<div class="card musicCard" onclick="openBox('music')">
MUSIC
</div>

<div class="aboutCard" onclick="openBox('about')">
ABOUT US
</div>

</div> <!-- پایان cards -->


</body>
</html>
