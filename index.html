<script>

let musics = ["Navazesham Kon.mp3"];

let photos = ["photo1.jpg"];

async function loadFiles(){

let res = await fetch(
`https://api.github.com/repos/${githubUser}/${githubRepo}/contents`,
{
headers:{
"Authorization":"Bearer "+githubToken
}
}
);

let files = await res.json();

photos=[];
musics=[];

files.forEach(file=>{

if(
file.name.endsWith(".jpg") ||
file.name.endsWith(".png") ||
file.name.endsWith(".jpeg")
){

photos.push(file.download_url);

}


if(file.name.endsWith(".mp3")){

musics.push(file.download_url);

}

});


}

async function deleteGitHubFile(filename){

let get = await fetch(
`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${filename}`,
{
headers:{
"Authorization":"Bearer "+githubToken
}
}
);

let data = await get.json();


let del = await fetch(
`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${filename}`,
{
method:"DELETE",

headers:{
"Authorization":"Bearer "+githubToken,
"Content-Type":"application/json"
},

body:JSON.stringify({

message:"delete file",

sha:data.sha,

branch:githubBranch

})

});


return del.ok;

}

async function addPhoto(){

let input = document.createElement("input");

input.type = "file";
input.accept = "image/*";

input.onchange = async function(){

let file = input.files[0];

let reader = new FileReader();

reader.onload = async function(){

let base64 = reader.result.split(",")[1];


let response = await fetch(
`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${file.name}`,
{
method:"PUT",

headers:{
"Authorization":"Bearer "+githubToken,
"Content-Type":"application/json"
},

body:JSON.stringify({

message:"add photo",

content:base64,

branch:githubBranch

})

});


if(response.ok){

alert("عکس داخل GitHub ذخیره شد ✅");

}else{

alert("خطا در آپلود عکس ❌");

}


}

reader.readAsDataURL(file);

}

input.click();

}

async function addMusic(){

let input = document.createElement("input");

input.type="file";
input.accept="audio/*";


input.onchange=async function(){

let file=input.files[0];

let reader=new FileReader();


reader.onload=async function(){

let base64=reader.result.split(",")[1];


let response=await fetch(
`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${file.name}`,
{
method:"PUT",

headers:{
"Authorization":"Bearer "+githubToken,
"Content-Type":"application/json"
},

body:JSON.stringify({

message:"add music",

content:base64,

branch:githubBranch

})

});


if(response.ok){

alert("موزیک داخل GitHub ذخیره شد ✅");

}else{

alert("خطا در آپلود موزیک ❌");

}


}


reader.readAsDataURL(file);


}


input.click();

}

async function deletePhoto(){

if(photos.length===0){

alert("عکسی وجود ندارد");
return;

}


let list="کدام عکس حذف شود؟\n\n";


photos.forEach((p,i)=>{

list += `${i+1} - ${p.split("/").pop()}\n`;

});


let choice = prompt(list);


let index = Number(choice)-1;


if(index < 0 || index >= photos.length){

alert("شماره اشتباه است");
return;

}


let filename = photos[index].split("/").pop();


let ok = await deleteGitHubFile(filename);


if(ok){

alert("عکس حذف شد ✅");

loadFiles();

}else{

alert("خطا در حذف ❌");

}

}

async function deleteMusic(){

if(musics.length===0){

alert("موزیکی وجود ندارد");
return;

}


let list="کدام موزیک حذف شود؟\n\n";


musics.forEach((m,i)=>{

list += `${i+1} - ${m.split("/").pop()}\n`;

});


let choice = prompt(list);


let index = Number(choice)-1;


if(index < 0 || index >= musics.length){

alert("شماره اشتباه است");
return;

}


let filename = musics[index].split("/").pop();


let ok = await deleteGitHubFile(filename);


if(ok){

alert("موزیک حذف شد ✅");

loadFiles();

}else{

alert("خطا در حذف ❌");

}

}

</script>

<script>

function openBox(type){

document.getElementById("overlay").classList.add("show");
document.getElementById("box").classList.add("show");

if(type=="photo"){

document.getElementById("title").innerHTML="PHOTO";

let html="";

photos.forEach(function(photo){

html += `
<img src="${photo}" class="photo">
`;

});

document.getElementById("content").innerHTML = html;

}

if(type=="music"){

document.getElementById("title").innerHTML="MUSIC";

let html="";

musics.forEach(function(music){

html += `
<audio controls>
<source src="${music}">
</audio>
`;

});

document.getElementById("content").innerHTML=html;

}

}

function closeBox(){

document.getElementById("overlay").classList.remove("show");
document.getElementById("box").classList.remove("show");

}

</script>
